name: sha-pay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shapay_user
      POSTGRES_PASSWORD: shapay_pass
      POSTGRES_DB: shapay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shapay_user -d shapay_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Repository root, so the image can include frontend/ (see Dockerfile).
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://shapay_user:shapay_pass@postgres:5432/shapay_db
      DATABASE_URL_SYNC: postgresql://shapay_user:shapay_pass@postgres:5432/shapay_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # DEBUG=true also exposes debug_otp in auth responses (local dev only;
      # the deployed service runs DEBUG=false). SECRET_KEY is generated per
      # process when unset.
      DEBUG: "true"
      MPESA_ENVIRONMENT: sandbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # The bind mount above shadows the image's /app/frontend.
      - ./frontend:/app/frontend:ro
      - backend_logs:/app/logs

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.core.celery_config worker -l info -Q reminders,payments
    environment:
      DATABASE_URL: postgresql+asyncpg://shapay_user:shapay_pass@postgres:5432/shapay_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # The scheduler lives in its own container on purpose: beat is what
    # actually triggers the payment/overdue reminder runs, and keeping it
    # separate means a worker restart never silently stops the schedule.
    command: celery -A app.core.celery_config beat -l info --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+asyncpg://shapay_user:shapay_pass@postgres:5432/shapay_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - celery_worker
      - redis
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  backend_logs:
