# Alembic configuration.
#
# The database URL is NOT set here: migrations/env.py reads DATABASE_URL through
# app.core.config, so there is one source of truth and no credentials in the repo.
#
# Run from backend/:
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe the change"
#   alembic stamp head        # mark an existing create_all database as current

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
