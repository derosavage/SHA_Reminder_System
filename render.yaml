services:
  - type: web
    name: sha-reminder-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # OTPs are delivered by SMS only. Do not add ALLOW_INSECURE_DEFAULTS=true
      # here: it used to make /auth/login return the OTP in the response body,
      # which let anyone sign in as any registered phone number. Provide
      # AT_API_KEY / AT_USERNAME / AT_SENDER_ID below instead.
      - key: MPESA_CALLBACK_SECRET
        generateValue: true
      - key: MPESA_ENVIRONMENT
        value: sandbox

