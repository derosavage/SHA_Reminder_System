name: SHA payment reminder trigger

on:
  schedule:
    - cron: "0 5 1,5,8 * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger payment-due reminder run
        env:
          API_BASE_URL: ${{ secrets.SHA_API_BASE_URL }}
          ADMIN_TRIGGER_TOKEN: ${{ secrets.ADMIN_TRIGGER_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --max-time 120 \
            -X POST \
            -H "X-Admin-Token: ${ADMIN_TRIGGER_TOKEN}" \
            "${API_BASE_URL}/api/v1/reminders/admin/run-payment-reminders"
